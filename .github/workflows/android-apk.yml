name: GENESE PAY Android APK and signed release gate
on:
  push:
    branches: [feature/carteira-financeira-mvp]
    paths: ['android/**', '.github/workflows/android-apk.yml', '.github/workflows/backend-ci.yml', 'wallet_api.py', 'render.yaml', 'Dockerfile']
  pull_request:
    branches: [feature/carteira-financeira-mvp]
    paths: ['android/**', '.github/workflows/android-apk.yml', '.github/workflows/backend-ci.yml', 'wallet_api.py', 'render.yaml', 'Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    name: Build and verify installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "Android SDK command-line tools not found in runner image" >&2
            exit 1
          }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses <<< "$(printf 'y\\n%.0s' {1..50})" >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Verify security defaults
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/genese/pay/MainActivity.java
          ! grep -R -E 'usesCleartextTraffic="true"|MIXED_CONTENT_ALWAYS_ALLOW' android/app/src/main
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package, signature, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.genese.pay.debug'"
          stat -c 'APK size: %s bytes' "$APK"
          sha256sum "$APK"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: genese-pay-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  release-readiness:
    name: Check release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Report production blockers
        shell: bash
        env:
          GENESE_BASE_URL: ${{ secrets.GENESE_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ "$GENESE_BASE_URL" =~ ^https://[^/]+ ]] || missing+=("GENESE_BASE_URL HTTPS público")
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64 (keystore de assinatura)")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} )); then
            echo 'APK debug: pode ser compilado para teste.'
            echo 'Release de produção bloqueado; faltam:'
            printf ' - %s\n' "${missing[@]}"
            echo 'Não publicar como produção até configurar domínio HTTPS, validar backend e assinatura.'
          else
            echo 'Segredos de URL e assinatura presentes. Ainda é obrigatório executar testes reais do backend antes da publicação.'
          fi

  build-release:
    name: Build signed production APK when secrets are configured
    runs-on: ubuntu-latest
    needs: build-debug
    timeout-minutes: 25
    env:
      GENESE_BASE_URL: ${{ secrets.GENESE_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check release configuration (fail loudly when blocked)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ "$GENESE_BASE_URL" =~ ^https://[^/]+ ]] || missing+=("GENESE_BASE_URL must be a public HTTPS backend URL")
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64 is missing")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD is missing")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS is missing")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD is missing")
          if (( ${#missing[@]} )); then
            echo "::error title=Signed release blocked::The signed release cannot be built. Configure the required GitHub Actions secrets."
            printf 'BLOCKER: %s\\n' "${missing[@]}"
            echo "See ANDROID_APK_STATUS.md for the exact prerequisites. No unsigned APK will be labelled as production."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-java@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.preflight.outputs.ready == 'true'
      - name: Install Android SDK packages
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses <<< "$(printf 'y\\n%.0s' {1..50})" >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify deployed HTTPS backend health before signing
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${GENESE_BASE_URL%/}"
          [[ "$BASE_URL" =~ ^https://[^/]+ ]] || { echo "Backend URL must use HTTPS." >&2; exit 1; }
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/health" -o "$RUNNER_TEMP/genese-health.json"
          python - "$RUNNER_TEMP/genese-health.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              health = json.load(handle)
          required = {
              "ok": True,
              "mode": "ledger-only",
              "pix_enabled": False,
              "real_money_enabled": False,
          }
          mismatches = {key: health.get(key) for key, expected in required.items() if health.get(key) != expected}
          if mismatches:
              raise SystemExit(f"Backend health validation failed: {mismatches}")
          print("PASS: public HTTPS backend is reachable and explicitly reports ledger-only/no-money mode.")
          PY
      - name: Decode signing keystore
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/genese-release.keystore"
          test -s "$RUNNER_TEMP/genese-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/genese-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.preflight.outputs.ready == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease -PGENESE_BASE_URL="$GENESE_BASE_URL"
      - name: Verify signed release APK and package id
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.genese.pay'"
          sha256sum "$APK"
      - name: Upload signed release APK
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genese-pay-android-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
