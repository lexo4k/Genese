name: Build GÊNESE PAY Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["Lexo/NutriFit"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - "Lexo/NutriFit"
      - "android-app-download"
      - "fix/android-apk-build-20261022"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: genese-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android 35 platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt
          {
            echo "## GÊNESE PAY APK"
            echo "- APK exists and ZIP archive validation passed."
            echo "- SHA-256: $(cut -d' ' -f1 apk-sha256.txt)"
            echo "- Signature: debug, for testing only, not production signing."
            echo "- The app does not generate revenue or move funds automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: genese-pay-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
