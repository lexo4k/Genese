name: GÊNESE PAY - release Android assinada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/genese-release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GENESE_BASE_URL: ${{ vars.GENESE_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GENESE_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configuração obrigatória ausente: $name. Cadastre-a em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          case "$GENESE_BASE_URL" in
            https://*) ;;
            *) echo "::error::GENESE_BASE_URL precisa começar com https://"; exit 1 ;;
          esac

      - name: Restore private signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Check live HTTPS backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$GENESE_BASE_URL/health" -o health.json
          python - <<'PY'
          import json
          p=json.load(open("health.json", encoding="utf-8"))
          assert p.get("ok") is True, "Healthcheck não confirmou ok=true"
          assert p.get("real_money_enabled") is False, "Backend está fora do modo seguro esperado"
          assert p.get("wallet_transfers_enabled") is False, "Transferências precisam permanecer desativadas até integração auditada"
          print("HTTPS acessível; backend em modo ledger-only confirmado. Nenhum saldo ou pagamento real presumido.")
          PY

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee app-release.sha256

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: GENESE-PAY-Android-Release-Assinado
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove private keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
