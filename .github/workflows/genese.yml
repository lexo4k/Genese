name: GENESE - testes externos

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: genese-public-check
  cancel-in-progress: true

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe
        run: python -m py_compile genese_autonomo.py priorizador_recompensas.py motor_receita.py genese_pay_web.py binance_public.py binance_account_readonly.py registro_recompensas.py

      - name: Testes unitários
        run: |
          python -m unittest discover -s tests -v
          python -m unittest -v test_binance_public

      - name: Executar diagnóstico externo
        shell: bash
        run: |
          set +e
          GENESE_TIMEOUT=8 GENESE_RETRIES=2 python -u genese_autonomo.py --json > genese_report.json
          code=$?
          echo "GENESE_EXIT_CODE=$code" >> "$GITHUB_STEP_SUMMARY"
          cat genese_report.json
          exit "$code"

      - name: Priorizar oportunidades públicas de recompensa
        shell: bash
        run: |
          set +e
          GENESE_TIMEOUT=12 GENESE_RETRIES=3 python -u priorizador_recompensas.py > genese_oportunidades_stdout.json
          code=$?
          echo "COLETOR_EXIT_CODE=$code" >> "$GITHUB_STEP_SUMMARY"
          if [ -f genese_oportunidades.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("genese_oportunidades.json", encoding="utf-8"))
          print(f"- Programas públicos lidos: {p.get('programas_publicos_lidos', 0)}")
          print(f"- Oportunidades relacionadas a cripto/Web3: {p.get('oportunidades_cripto_web3', 0)}")
          print("- Pagamento automático: não")
          PY
          fi
          exit "$code"

      - name: Descobrir oportunidades públicas de receita
        shell: bash
        run: |
          set +e
          GENESE_TIMEOUT=12 GENESE_RETRIES=2 python -u motor_receita.py --json > genese_receita_stdout.json
          code=$?
          echo "MOTOR_RECEITA_EXIT_CODE=$code" >> "$GITHUB_STEP_SUMMARY"
          if [ -f genese_receita.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("genese_receita.json", encoding="utf-8"))
          r=p.get("resumo", {})
          print(f"- Candidatas encontradas: {r.get('candidatas_encontradas', 0)}")
          print(f"- Candidatas cripto/Web3: {r.get('candidatas_cripto_web3', 0)}")
          print(f"- Fontes consultadas com sucesso: {r.get('fontes_ok', 0)}")
          print(f"- Receita confirmada: {r.get('receita_confirmada', 0)}")
          print(f"- Saldo Binance consultado: {r.get('saldo_binance_consultado', False)}")
          print(f"- Transferência executada: {r.get('transferencia_executada', False)}")
          PY
          fi
          exit "$code"

      - name: Identificar execução real
        run: echo "Execução GÊNESE iniciada no runner do GitHub Actions" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo de conectividade
        if: always()
        shell: bash
        run: |
          echo "## GÊNESE: resultado" >> "$GITHUB_STEP_SUMMARY"
          if [ -f genese_report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("genese_report.json", encoding="utf-8"))
          r=p.get("resumo", {})
          print(f"- DNS: {r.get('dns_ok', 0)}/{r.get('dns_total', 0)}")
          print(f"- HTTPS externo: {r.get('https_ok', False)}")
          print(f"- Catálogo público: {r.get('catalogo_publico_ok', False)}")
          print(f"- API de câmbio: {r.get('cambio_ok', False)}")
          print(f"- Conectividade externa confirmada: {r.get('conectividade_externa_confirmada', False)}")
          print(f"- Ganhos confirmados: {r.get('ganhos_confirmados', 0)}")
          PY
          fi

      - name: Guardar relatórios para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genese-relatorios
          path: |
            genese_report.json
            genese_oportunidades.json
            genese_oportunidades_stdout.json
            genese_receita.json
            genese_receita_stdout.json
          if-no-files-found: warn
          retention-days: 14
