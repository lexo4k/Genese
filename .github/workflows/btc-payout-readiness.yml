name: Bitcoin payout destination validation

on:
  push:
    branches:
      - feat/btc-payout-readiness
  pull_request:
    branches:
      - feat/btc-payout-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile module and tests
        run: python -m py_compile btc_payout_readiness.py tests/test_btc_payout_readiness.py
      - name: Run payout destination tests
        run: python -m unittest discover -s tests -p 'test_btc_payout_readiness.py' -v
